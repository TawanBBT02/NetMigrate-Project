!
! Distribution switch, campus building B
!
version 16.12
service timestamps debug datetime msec
!
hostname DIST-SW-B01
!
no aaa new-model
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name USERS_FLOOR1
!
vlan 11
 name USERS_FLOOR2
!
vlan 20
 name VOICE
!
vlan 30
 name PRINTERS
!
vlan 99
 name MGMT
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-CORE-1
 switchport mode trunk
 switchport trunk allowed vlan 10,11,20,30,99
 switchport trunk native vlan 99
 no shutdown
!
interface GigabitEthernet1/0/2
 description UPLINK-TO-CORE-2
 switchport mode trunk
 switchport trunk allowed vlan 10,11,20,30,99
 switchport trunk native vlan 99
 no shutdown
!
interface GigabitEthernet1/0/10
 description AP-FLOOR1-01
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
interface GigabitEthernet1/0/24
 description PRINTER-HR
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface Vlan99
 description MANAGEMENT
 ip address 10.99.1.11 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 10.99.1.1
!
ip http server
no ip http secure-server
!
snmp-server community public RO
snmp-server location BUILDING-B-IDF2
!
ntp server 10.99.1.5
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
