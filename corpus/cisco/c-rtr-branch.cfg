!
hostname BR-RTR-CHONBURI
!
enable secret 9 $9$kQ2mPl0xVnBqRe$yTgH3nMwQ8sLpXvZ
username netadmin privilege 15 secret 9 $9$aB3cD4eF5gH6iJ$kL7mN8oP9qR0sT
!
interface Loopback0
 description ROUTER-ID
 ip address 10.255.0.7 255.255.255.255
!
interface GigabitEthernet0/0/0
 description WAN-TO-HQ
 ip address 172.31.7.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/1
 description LAN
 ip address 10.7.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/2
 description BACKUP-LINK
 ip address 192.168.77.2 255.255.255.252
 shutdown
!
router ospf 10
 router-id 10.255.0.7
 network 10.255.0.7 0.0.0.0 area 0
 network 172.31.7.0 0.0.0.3 area 0
 network 10.7.0.0 0.0.0.255 area 7
 passive-interface GigabitEthernet0/0/1
!
ip route 0.0.0.0 0.0.0.0 172.31.7.1
ip route 10.200.0.0 255.255.0.0 192.168.77.1 200
ip route 192.0.2.0 255.255.255.0 Null0
!
ip access-list extended MGMT-IN
 permit tcp 10.99.0.0 0.0.255.255 any eq 22
 deny   ip any any log
!
ip nat inside source list 1 interface GigabitEthernet0/0/0 overload
!
end
