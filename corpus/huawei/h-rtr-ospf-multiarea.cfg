#
sysname HQ-RTR-01
#
interface LoopBack0
 description ROUTER-ID
 ip address 10.255.0.1 255.255.255.255
#
interface GigabitEthernet0/0/0
 description CORE-LINK
 ip address 172.31.0.1 255.255.255.252
 undo shutdown
#
interface GigabitEthernet0/0/1
 description BRANCH-AGG
 ip address 172.31.7.1 30
 undo shutdown
#
ospf 10 router-id 10.255.0.1
 area 0.0.0.0
  network 10.255.0.1 0.0.0.0
  network 172.31.0.0 0.0.0.3
 area 0.0.0.7
  network 172.31.7.0 0.0.0.3
#
ip route-static 0.0.0.0 0.0.0.0 172.31.0.2
ip route-static 10.200.0.0 255.255.0.0 NULL0
ip route-static 198.51.100.0 255.255.255.0 172.31.0.2 preference 150
#
nqa test-instance admin wan-probe
 test-type icmp
 destination-address ipv4 8.8.8.8
#
return
