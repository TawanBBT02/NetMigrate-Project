{% extends "base.html" %}

{% block title %}Convert &mdash; NetMigrate{% endblock %}

{% block content %}
<div class="space-y-6">
  <h1 class="text-xl font-semibold">Single conversion</h1>

  <form id="convert-form" class="grid gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2 flex flex-wrap items-end gap-4">
      <div>
        <label for="source-vendor" class="block text-sm font-medium mb-1">Source vendor</label>
        <select id="source-vendor" name="source_vendor"
                class="rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-2 py-1.5 text-sm">
          <option value="auto" selected>Auto-detect</option>
          <option value="cisco">Cisco IOS-XE</option>
          <option value="huawei">Huawei VRP</option>
        </select>
      </div>

      <div class="pb-2 text-gray-400" aria-hidden="true">&rarr;</div>

      <div>
        <label for="target-vendor" class="block text-sm font-medium mb-1">Target vendor</label>
        <select id="target-vendor" name="target_vendor"
                class="rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-2 py-1.5 text-sm">
          <option value="huawei" selected>Huawei VRP</option>
          <option value="cisco">Cisco IOS-XE</option>
        </select>
      </div>

      <label class="flex items-center gap-2 text-sm pb-2">
        <input type="checkbox" id="use-ai" name="use_ai" checked
               class="rounded border-gray-300 dark:border-gray-600">
        Use AI fallback for unmapped blocks
      </label>
    </div>

    <div class="sm:col-span-2">
      <div class="flex items-center justify-between mb-1">
        <label for="source-text" class="block text-sm font-medium">Source configuration</label>
        <label class="text-sm text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
          Load from file
          <input type="file" id="source-file" accept=".cfg,.txt,.conf" class="hidden">
        </label>
      </div>
      <textarea id="source-text" name="text" rows="14" spellcheck="false" required
                placeholder="Paste a Cisco IOS-XE or Huawei VRP configuration..."
                class="config-pre w-full rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 text-sm"></textarea>
      <input type="hidden" id="source-filename" name="filename" value="">
    </div>

    <div class="sm:col-span-2">
      <button type="submit" id="convert-btn"
              class="px-4 py-2 rounded bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 text-sm font-medium hover:opacity-90 disabled:opacity-50">
        Convert
      </button>
      <span id="convert-status" class="ml-3 text-sm text-gray-500 dark:text-gray-400"></span>
    </div>
  </form>

  <section id="result-section" class="hidden space-y-4">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-1 text-sm text-gray-600 dark:text-gray-300"
         id="result-metrics"></div>

    <div class="flex flex-wrap gap-2">
      <button type="button" id="copy-btn"
              class="px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">
        Copy output
      </button>
      <button type="button" id="download-btn"
              class="px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">
        Download output
      </button>
    </div>

    <div id="diff-view"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/diff.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('convert-form');
    const sourceText = document.getElementById('source-text');
    const sourceFile = document.getElementById('source-file');
    const sourceFilename = document.getElementById('source-filename');
    const convertBtn = document.getElementById('convert-btn');
    const statusEl = document.getElementById('convert-status');
    const resultSection = document.getElementById('result-section');
    const resultMetrics = document.getElementById('result-metrics');
    const diffView = document.getElementById('diff-view');
    const copyBtn = document.getElementById('copy-btn');
    const downloadBtn = document.getElementById('download-btn');

    let lastResult = null;

    sourceFile.addEventListener('change', () => {
      const file = sourceFile.files[0];
      if (!file) return;
      sourceFilename.value = file.name;
      const reader = new FileReader();
      reader.onload = () => {
        sourceText.value = String(reader.result || '');
      };
      reader.readAsText(file);
    });

    function renderMetrics(metrics, detectedSource) {
      resultMetrics.textContent = '';
      const entries = [
        ['Detected source', detectedSource],
        ['Significant lines', metrics.significant_lines],
        ['Rule coverage', `${(metrics.rule_coverage * 100).toFixed(1)}%`],
        ['AI lines', metrics.ai_lines],
        ['Unmapped lines', metrics.unmapped_lines],
        ['Duration', `${metrics.duration_ms.toFixed(2)} ms`],
      ];
      for (const [label, value] of entries) {
        const span = document.createElement('span');
        const strong = document.createElement('strong');
        strong.className = 'font-medium text-gray-900 dark:text-gray-100';
        strong.textContent = `${label}: `;
        span.appendChild(strong);
        span.appendChild(document.createTextNode(String(value)));
        resultMetrics.appendChild(span);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = sourceText.value;
      if (!text.trim()) {
        NetMigrate.showError('Enter or load a configuration first.');
        return;
      }

      convertBtn.disabled = true;
      statusEl.textContent = 'Converting...';

      try {
        const payload = await NetMigrate.apiPost('/api/convert', {
          text,
          source_vendor: document.getElementById('source-vendor').value,
          target_vendor: document.getElementById('target-vendor').value,
          filename: sourceFilename.value || null,
          use_ai: document.getElementById('use-ai').checked,
        });

        lastResult = payload;
        renderMetrics(payload.metrics, payload.detected_source);
        NetMigrateDiff.render(diffView, payload);
        resultSection.classList.remove('hidden');
        statusEl.textContent = `Saved as conversion #${payload.conversion_id}.`;
      } catch (err) {
        statusEl.textContent = '';
      } finally {
        convertBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!lastResult) return;
      try {
        await navigator.clipboard.writeText(lastResult.output_text);
        statusEl.textContent = 'Output copied to clipboard.';
      } catch (err) {
        NetMigrate.showError('Could not copy to clipboard.');
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastResult) return;
      const stem = (sourceFilename.value || 'output').replace(/\.[^.]+$/, '');
      const name = `${stem}_${lastResult.target_vendor}.cfg`;
      const blob = new Blob([lastResult.output_text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  });
</script>
{% endblock %}
